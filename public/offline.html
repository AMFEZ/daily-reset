<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#000000"
    />
    <title>Daily Reset Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
        background: #000;
        color: #e5e5e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding:
          max(24px, env(safe-area-inset-top))
          18px
          max(24px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at top,
            #07130b 0,
            #000 42%
          );
      }

      main {
        width: min(100%, 680px);
        border: 1px solid #365341;
        background: #020302;
      }

      header {
        border-bottom: 1px solid #365341;
        background: #06110a;
        padding: 16px;
      }

      h1 {
        margin: 0;
        color: #39ff88;
        font-size: 18px;
        letter-spacing: 0.06em;
      }

      section {
        padding: 18px;
      }

      p {
        margin: 0;
        line-height: 1.7;
      }

      .muted {
        margin-top: 12px;
        color: #9a9a9a;
        font-size: 13px;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 18px;
        border: 1px solid #39ff88;
        background: #000;
        color: #39ff88;
        font: inherit;
        text-align: left;
        padding: 12px 14px;
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>&gt; daily_reset.offline</h1>
      </header>

      <section>
        <p>
          No saved app shell is available on this device yet.
        </p>

        <p class="muted">
          Reconnect once, open Daily Reset while signed in, and leave it open
          for a few seconds. After that, the installed app can reopen with no
          signal.
        </p>

        <button
          type="button"
          onclick="window.location.reload()"
        >
          &gt; retry_connection
        </button>
      </section>
    </main>
  </body>
</html>
